<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手機畫畫競速 - AI 智慧挑戰版</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            background-color: #f0f2f5;
            margin: 0;
            padding: 15px;
        }
        h1 { color: #333; font-size: 22px; margin-bottom: 5px; }
        .game-box {
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            max-width: 400px;
            margin: 0 auto;
        }
        .info-bar {
            display: flex;
            justify-content: space-between;
            font-size: 16px;
            font-weight: bold;
            color: #555;
            margin-bottom: 10px;
        }
        #word {
            font-size: 32px;
            color: #ff5722;
            font-weight: bold;
            margin: 10px 0;
        }
        canvas {
            border: 2px solid #ddd;
            border-radius: 8px;
            background: #fff;
            touch-action: none;
            cursor: crosshair;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            flex: 1;
        }
        .btn-clear { background-color: #f44336; }
        #message {
            font-size: 16px;
            color: #009688;
            font-weight: bold;
            height: 24px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="game-box">
        <h1>🎨 AI 畫畫急先鋒</h1>
        <div class="info-bar">
            <span id="progress">進度：1 / 5 題</span>
            <span id="timer">倒數：60 秒</span>
        </div>
        
        <p>請畫出：</p>
        <div id="word">準備開始</div>
        
        <canvas id="paintCanvas" width="300" height="300"></canvas>
        
        <div id="message">請在畫布上作畫，AI 正在辨識...</div>

        <div class="btn-group">
            <button class="btn btn-clear" onclick="clearCanvas()">清除重畫</button>
            <button class="btn" onclick="startGame()">重新開始</button>
        </div>
    </div>

    <script>
        const words = ["蘋果", "房子", "貓咪", "太陽", "雨傘", "香蕉", "星星", "車子", "樹木", "眼鏡"];
        let currentWord = "";
        let currentIndex = 0;
        let totalTarget = 5;
        let timeLeft = 60;
        let timerInterval = null;
        let gameActive = false;

        const canvas = document.getElementById("paintCanvas");
        const ctx = canvas.getContext("2d");
        let painting = false;
        let strokeCount = 0; // 記錄筆畫數，防止亂畫

        function startGame() {
            currentIndex = 0;
            timeLeft = 60;
            gameActive = true;
            document.getElementById("message").innerText = "遊戲開始！快動筆！";
            nextWord();

            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById("timer").innerText = "倒數：" + timeLeft + " 秒";
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    gameActive = false;
                    alert("⏰ 時間到！挑戰結束！");
                    document.getElementById("message").innerText = "逾時未完成，請點擊重新開始";
                }
            }, 1000);
        }

        function nextWord() {
            if (currentIndex >= totalTarget) {
                clearInterval(timerInterval);
                gameActive = false;
                alert(`🎉 恭喜通關！你成功在 ${60 - timeLeft} 秒內畫完 5 個題目！`);
                document.getElementById("message").innerText = "通關成功！太神啦！";
                return;
            }
            currentWord = words[Math.floor(Math.random() * words.length)];
            document.getElementById("word").innerText = currentWord;
            document.getElementById("progress").innerText = `進度：${currentIndex + 1} / ${totalTarget} 題`;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            strokeCount = 0;
        }

        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            strokeCount = 0;
        }

        // 畫圖邏輯
        function startPosition(e) {
            if (!gameActive) return;
            painting = true;
            strokeCount++;
            draw(e);
        }
        function endPosition() {
            painting = false;
            ctx.beginPath();
            
            // 當玩家畫到一定筆畫或停手時，模擬 AI 偵測
            if (gameActive && strokeCount >= 3) {
                checkAIPrediction();
            }
        }
        function draw(e) {
            if (!painting || !gameActive) return;
            ctx.lineWidth = 6;
            ctx.lineCap = "round";
            ctx.strokeStyle = "#222";

            let rect = canvas.getBoundingClientRect();
            let x = (e.clientX || e.touches[0].clientX) - rect.left;
            let y = (e.clientY || e.touches[0].clientY) - rect.top;

            ctx.lineTo(x, y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x, y);
        }

        // 模擬智慧 AI 偵測（檢查線條豐富度與隨機判定，避免隨機亂劃）
        function checkAIPrediction() {
            let msg = document.getElementById("message");
            msg.innerText = "🔍 AI 正在掃描筆畫...";
            
            setTimeout(() => {
                if (!gameActive) return;
                // 這裡加入簡單的防呆：必須有足夠的繪圖動作，AI 才會判定成功
                if (strokeCount >= 3) {
                    msg.innerText = `✨ AI 辨識成功：這絕對是「${currentWord}」！`;
                    currentIndex++;
                    setTimeout(() => {
                        if(gameActive) nextWord();
                    }, 1000);
                } else {
                    msg.innerText = "❌ AI 覺得筆畫太少，再加點細節！";
                }
            }, 600);
        }

        canvas.addEventListener("mousedown", startPosition);
        canvas.addEventListener("mouseup", endPosition);
        canvas.addEventListener("mousemove", draw);

        canvas.addEventListener("touchstart", startPosition);
        canvas.addEventListener("touchend", endPosition);
        canvas.addEventListener("touchmove", draw);

        // 自動開始第一局
        startGame();
    </script>
</body>
</html>
